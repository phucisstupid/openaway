name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v0.4.7)
        required: true
        type: string
      dmg_only:
        description: Only create a DMG for an already published release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: ${{ !inputs.dmg_only }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release version
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          [[ "$RELEASE_TAG" == "v$VERSION" ]] || exit 1
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$(git rev-parse HEAD)" ]] || exit 1
      - name: Test timer behavior
        run: swift test
      - name: Build arm64 app and icon
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]] || exit 1
          ./scripts/build-app.sh
          mv dist/OpenAway-macos.zip dist/OpenAway-macos-arm64.zip
      - name: Verify arm64 archive and checksum
        run: |
          set -euo pipefail
          VERIFY_DIR=$(mktemp -d)
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          ditto -x -k dist/OpenAway-macos-arm64.zip "$VERIFY_DIR"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$VERIFY_DIR/OpenAway.app/Contents/Info.plist")
          [[ "$RELEASE_TAG" == "v$APP_VERSION" ]] || exit 1
          test -s "$VERIFY_DIR/OpenAway.app/Contents/Resources/AppIcon.icns"
          codesign --verify --deep --strict "$VERIFY_DIR/OpenAway.app"
          [[ "$(lipo -archs "$VERIFY_DIR/OpenAway.app/Contents/MacOS/OpenAway")" == arm64 ]] || exit 1
          cd dist
          shasum -a 256 OpenAway-macos-arm64.zip > OpenAway-macos-arm64.zip.sha256
          shasum -a 256 -c OpenAway-macos-arm64.zip.sha256
      - name: Build universal app and icon
        run: ./scripts/build-app.sh --universal
      - name: Verify release archive and checksum
        run: |
          set -euo pipefail
          VERIFY_DIR=$(mktemp -d)
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          ditto -x -k dist/OpenAway-macos-universal.zip "$VERIFY_DIR"
          test -s "$VERIFY_DIR/OpenAway.app/Contents/Resources/AppIcon.icns"
          codesign --verify --deep --strict "$VERIFY_DIR/OpenAway.app"
          lipo "$VERIFY_DIR/OpenAway.app/Contents/MacOS/OpenAway" -verify_arch arm64
          lipo "$VERIFY_DIR/OpenAway.app/Contents/MacOS/OpenAway" -verify_arch x86_64
          cd dist
          shasum -a 256 OpenAway-macos-universal.zip > OpenAway-macos-universal.zip.sha256
          shasum -a 256 -c OpenAway-macos-universal.zip.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_NOTES=$(git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG")
          gh release create "$RELEASE_TAG" \
            dist/OpenAway-macos-arm64.zip dist/OpenAway-macos-arm64.zip.sha256 \
            dist/OpenAway-macos-universal.zip dist/OpenAway-macos-universal.zip.sha256 \
            --verify-tag --title "OpenAway ${RELEASE_TAG#v}" --notes "$RELEASE_NOTES"

  create-dmg:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.dmg_only)) }}
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify and download published app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          EXISTING_DMG=$(gh release view "$RELEASE_TAG" --json assets --jq 'any(.assets[]; .name == "OpenAway-macos-universal.dmg" or .name == "OpenAway-macos-universal.dmg.sha256" or .name == "OpenAway-macos.dmg" or .name == "OpenAway-macos.dmg.sha256")')
          if [[ "$EXISTING_DMG" == true ]]; then
            echo "::error::DMG assets already exist; refusing to overwrite published files."
            exit 1
          fi
          WORK_DIR=$(mktemp -d)
          echo "DMG_WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"
          cd "$WORK_DIR"
          # Recovery also supports releases published before universal assets were named explicitly.
          UNIVERSAL_ZIP=$(gh release view "$RELEASE_TAG" --json assets --jq 'if any(.assets[]; .name == "OpenAway-macos-universal.zip") then "OpenAway-macos-universal.zip" else "OpenAway-macos.zip" end')
          gh release download "$RELEASE_TAG" --pattern "$UNIVERSAL_ZIP" --pattern "$UNIVERSAL_ZIP.sha256"
          [[ "$(wc -l < "$UNIVERSAL_ZIP.sha256")" -eq 1 ]] || exit 1
          read -r CHECKSUM ASSET_NAME < "$UNIVERSAL_ZIP.sha256"
          [[ "$CHECKSUM" =~ ^[a-f0-9]{64}$ && "$ASSET_NAME" == "$UNIVERSAL_ZIP" ]] || exit 1
          shasum -a 256 -c "$UNIVERSAL_ZIP.sha256"
          ditto -x -k "$UNIVERSAL_ZIP" "$WORK_DIR"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' OpenAway.app/Contents/Info.plist)
          [[ "$RELEASE_TAG" == "v$APP_VERSION" ]] || exit 1
          codesign --verify --deep --strict OpenAway.app
      - name: Resolve latest create-dmg release
        id: create-dmg-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CREATE_DMG_TAG=$(gh api repos/create-dmg/create-dmg/releases/latest --jq '.tag_name')
          echo "tag=$CREATE_DMG_TAG" >> "$GITHUB_OUTPUT"
      - name: Checkout create-dmg
        uses: actions/checkout@v7
        with:
          repository: create-dmg/create-dmg
          ref: ${{ steps.create-dmg-version.outputs.tag }}
          path: create-dmg
          persist-credentials: false
      - name: Package and verify DMG
        run: |
          set -euo pipefail
          WORK_DIR="$DMG_WORK_DIR"
          MOUNTED=false
          cleanup_mount() {
            if [[ "$MOUNTED" == true ]]; then
              hdiutil detach "$WORK_DIR/mount"
            fi
          }
          trap cleanup_mount EXIT
          cd "$WORK_DIR"
          mkdir source
          mv OpenAway.app source/
          "$GITHUB_WORKSPACE/create-dmg/create-dmg" \
            --volname OpenAway \
            --window-pos 200 120 --window-size 600 400 \
            --icon-size 100 --icon OpenAway.app 160 180 \
            --app-drop-link 440 180 \
            "$WORK_DIR/OpenAway-macos-universal.dmg" "$WORK_DIR/source"
          hdiutil verify OpenAway-macos-universal.dmg
          mkdir "$WORK_DIR/mount"
          hdiutil attach OpenAway-macos-universal.dmg -readonly -nobrowse -mountpoint "$WORK_DIR/mount"
          MOUNTED=true
          codesign --verify --deep --strict "$WORK_DIR/mount/OpenAway.app"
          lipo "$WORK_DIR/mount/OpenAway.app/Contents/MacOS/OpenAway" -verify_arch arm64
          lipo "$WORK_DIR/mount/OpenAway.app/Contents/MacOS/OpenAway" -verify_arch x86_64
          diff -qr source/OpenAway.app "$WORK_DIR/mount/OpenAway.app"
          [[ -L "$WORK_DIR/mount/Applications" && "$(readlink "$WORK_DIR/mount/Applications")" == /Applications ]] || exit 1
          hdiutil detach "$WORK_DIR/mount"
          MOUNTED=false
          shasum -a 256 OpenAway-macos-universal.dmg > OpenAway-macos-universal.dmg.sha256
          shasum -a 256 -c OpenAway-macos-universal.dmg.sha256
      - name: Publish DMG assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$DMG_WORK_DIR/OpenAway-macos-universal.dmg" "$DMG_WORK_DIR/OpenAway-macos-universal.dmg.sha256"
      - name: Clean packaging files
        if: always()
        run: |
          if [[ -n "${DMG_WORK_DIR:-}" ]]; then
            if [[ -d "$DMG_WORK_DIR/mount/OpenAway.app" ]]; then
              hdiutil detach "$DMG_WORK_DIR/mount"
            fi
            rm -rf "$DMG_WORK_DIR"
          fi
