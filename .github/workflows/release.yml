name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v0.4.7)
        required: true
        type: string
      update_cask_only:
        description: Only sync the cask for an already published release
        required: false
        default: false
        type: boolean
      dmg_only:
        description: Only create a DMG for an already published release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !inputs.update_cask_only && !inputs.dmg_only }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release version
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          [[ "$RELEASE_TAG" == "v$VERSION" ]]
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$(git rev-parse HEAD)" ]]
      - name: Test timer behavior
        run: swift test
      - name: Build universal app
        run: ./scripts/build-app.sh --universal
      - name: Verify release archive and checksum
        run: |
          set -euo pipefail
          VERIFY_DIR=$(mktemp -d)
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          ditto -x -k dist/OpenAway-macos.zip "$VERIFY_DIR"
          codesign --verify --deep --strict "$VERIFY_DIR/OpenAway.app"
          lipo "$VERIFY_DIR/OpenAway.app/Contents/MacOS/OpenAway" -verify_arch arm64
          lipo "$VERIFY_DIR/OpenAway.app/Contents/MacOS/OpenAway" -verify_arch x86_64
          cd dist
          shasum -a 256 OpenAway-macos.zip > OpenAway-macos.zip.sha256
          shasum -a 256 -c OpenAway-macos.zip.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_NOTES=$(git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG")
          RELEASE_NOTES+=$'\n\n'
          RELEASE_NOTES+="Universal app for Apple Silicon and Intel Macs running macOS 13 or later. Ad-hoc signed, not notarized. If macOS blocks the app, use System Settings > Privacy & Security > Open Anyway."
          gh release create "$RELEASE_TAG" \
            dist/OpenAway-macos.zip dist/OpenAway-macos.zip.sha256 \
            --verify-tag --title "OpenAway ${RELEASE_TAG#v}" --notes "$RELEASE_NOTES"

  create-dmg:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.dmg_only)) }}
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify and download published app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.update_cask_only || false }}" == true ]]; then
            echo "::error::Select only one recovery option: dmg_only or update_cask_only."
            exit 1
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          EXISTING_DMG=$(gh release view "$RELEASE_TAG" --json assets --jq 'any(.assets[]; .name == "OpenAway-macos.dmg" or .name == "OpenAway-macos.dmg.sha256")')
          if [[ "$EXISTING_DMG" == true ]]; then
            echo "::error::DMG assets already exist; refusing to overwrite published files."
            exit 1
          fi
          WORK_DIR=$(mktemp -d)
          echo "DMG_WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"
          cd "$WORK_DIR"
          gh release download "$RELEASE_TAG" --pattern 'OpenAway-macos.zip' --pattern 'OpenAway-macos.zip.sha256'
          [[ "$(wc -l < OpenAway-macos.zip.sha256)" -eq 1 ]]
          read -r CHECKSUM ASSET_NAME < OpenAway-macos.zip.sha256
          [[ "$CHECKSUM" =~ ^[a-f0-9]{64}$ && "$ASSET_NAME" == "OpenAway-macos.zip" ]]
          shasum -a 256 -c OpenAway-macos.zip.sha256
          ditto -x -k OpenAway-macos.zip "$WORK_DIR"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' OpenAway.app/Contents/Info.plist)
          [[ "$RELEASE_TAG" == "v$APP_VERSION" ]]
          codesign --verify --deep --strict OpenAway.app
      - name: Package and verify DMG
        run: |
          set -euo pipefail
          WORK_DIR="$DMG_WORK_DIR"
          MOUNTED=false
          cleanup_mount() {
            if [[ "$MOUNTED" == true ]]; then
              hdiutil detach "$WORK_DIR/mount"
            fi
          }
          trap cleanup_mount EXIT
          cd "$WORK_DIR"
          npx --yes create-dmg@8.1.0 --no-code-sign --no-version-in-filename "$WORK_DIR/OpenAway.app" "$WORK_DIR"
          mv OpenAway.dmg OpenAway-macos.dmg
          hdiutil verify OpenAway-macos.dmg
          mkdir "$WORK_DIR/mount"
          hdiutil attach OpenAway-macos.dmg -readonly -nobrowse -mountpoint "$WORK_DIR/mount"
          MOUNTED=true
          codesign --verify --deep --strict "$WORK_DIR/mount/OpenAway.app"
          lipo "$WORK_DIR/mount/OpenAway.app/Contents/MacOS/OpenAway" -verify_arch arm64
          lipo "$WORK_DIR/mount/OpenAway.app/Contents/MacOS/OpenAway" -verify_arch x86_64
          diff -qr OpenAway.app "$WORK_DIR/mount/OpenAway.app"
          [[ -L "$WORK_DIR/mount/Applications" && "$(readlink "$WORK_DIR/mount/Applications")" == /Applications ]]
          hdiutil detach "$WORK_DIR/mount"
          MOUNTED=false
          shasum -a 256 OpenAway-macos.dmg > OpenAway-macos.dmg.sha256
          shasum -a 256 -c OpenAway-macos.dmg.sha256
      - name: Publish DMG assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$DMG_WORK_DIR/OpenAway-macos.dmg" "$DMG_WORK_DIR/OpenAway-macos.dmg.sha256"
      - name: Clean packaging files
        if: always()
        run: |
          if [[ -n "${DMG_WORK_DIR:-}" ]]; then
            if [[ -d "$DMG_WORK_DIR/mount/OpenAway.app" ]]; then
              hdiutil detach "$DMG_WORK_DIR/mount"
            fi
            rm -rf "$DMG_WORK_DIR"
          fi

  update-cask:
    needs: release
    if: ${{ !cancelled() && !inputs.dmg_only && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.update_cask_only)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: cask-update
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test cask updater
        run: ruby scripts/test-cask.rb
      - name: Sync cask with published release
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          LATEST_TAG=$(gh release view --json tagName --jq '.tagName')
          if [[ "$RELEASE_TAG" != "$LATEST_TAG" ]]; then
            echo "Skipping $RELEASE_TAG; latest stable release is $LATEST_TAG"
            exit 0
          fi
          ASSET_DIR=$(mktemp -d)
          trap 'rm -rf "$ASSET_DIR"' EXIT
          gh release download "$RELEASE_TAG" --pattern 'OpenAway-macos.zip' --pattern 'OpenAway-macos.zip.sha256' --dir "$ASSET_DIR"
          [[ "$(wc -l < "$ASSET_DIR/OpenAway-macos.zip.sha256")" -eq 1 ]]
          read -r CHECKSUM ASSET_NAME < "$ASSET_DIR/OpenAway-macos.zip.sha256"
          [[ "$CHECKSUM" =~ ^[a-f0-9]{64}$ && "$ASSET_NAME" == "OpenAway-macos.zip" ]]
          [[ "$(sha256sum "$ASSET_DIR/OpenAway-macos.zip" | cut -d ' ' -f 1)" == "$CHECKSUM" ]]
          ruby scripts/update-cask.rb "${RELEASE_TAG#v}" "$CHECKSUM" Casks/openaway.rb
          ruby -c Casks/openaway.rb
      - name: Commit cask update
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks/openaway.rb; then
            echo "No cask update needed"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/openaway.rb
          git commit -m "Update OpenAway cask to ${RELEASE_TAG#v}"
          git push origin "HEAD:$DEFAULT_BRANCH"
