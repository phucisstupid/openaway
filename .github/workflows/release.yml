name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v0.4.7)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release version
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          [[ "$RELEASE_TAG" == "v$VERSION" ]]
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$(git rev-parse HEAD)" ]]
      - name: Test timer behavior
        run: swift test
      - name: Build universal app
        run: ./scripts/build-app.sh --universal
      - name: Verify release archive and checksum
        run: |
          set -euo pipefail
          VERIFY_DIR=$(mktemp -d)
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          ditto -x -k dist/OpenAway-macos.zip "$VERIFY_DIR"
          codesign --verify --deep --strict "$VERIFY_DIR/OpenAway.app"
          lipo "$VERIFY_DIR/OpenAway.app/Contents/MacOS/OpenAway" -verify_arch arm64
          lipo "$VERIFY_DIR/OpenAway.app/Contents/MacOS/OpenAway" -verify_arch x86_64
          cd dist
          shasum -a 256 OpenAway-macos.zip > OpenAway-macos.zip.sha256
          shasum -a 256 -c OpenAway-macos.zip.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_NOTES=$(git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG")
          RELEASE_NOTES+=$'\n\n'
          RELEASE_NOTES+="Universal app for Apple Silicon and Intel Macs running macOS 13 or later. Ad-hoc signed, not notarized. If macOS blocks the app, use System Settings > Privacy & Security > Open Anyway."
          gh release create "$RELEASE_TAG" \
            dist/OpenAway-macos.zip dist/OpenAway-macos.zip.sha256 \
            --verify-tag --title "OpenAway ${RELEASE_TAG#v}" --notes "$RELEASE_NOTES"
