name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      matrix:
        os: [macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Test timer behavior
        run: swift test
      - name: Build native app
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: OpenAway-${{ matrix.os }}
          path: dist/OpenAway-macos.zip
